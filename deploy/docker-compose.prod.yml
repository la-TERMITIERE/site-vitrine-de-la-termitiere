name: termitiere-vitrine

services:

  # ============================================================
  # SITE VITRINE
  # ============================================================

  vitrine:
    image: ${VITRINE_IMAGE}

    container_name: termitiere-vitrine

    restart: unless-stopped

    networks:
      - deploy_default


  # ============================================================
  # CONTACT PROXY
  # ============================================================

  contact-proxy:
    image: ${CONTACT_PROXY_IMAGE}

    container_name: termitiere-contact-proxy

    restart: unless-stopped

    environment:
      PORT: "8081"
      BREVO_API_KEY: "${BREVO_API_KEY}"
      BREVO_SENDER_EMAIL: "${BREVO_SENDER_EMAIL}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN}"

    networks:
      - deploy_default


  # ============================================================
  # CHAT PROXY (assistant IA « Termi », joint via nginx sur /api/chat)
  # ============================================================

  chat-proxy:
    image: ${CHAT_PROXY_IMAGE}

    container_name: termitiere-chat-proxy

    restart: unless-stopped

    environment:
      PORT: "8083"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      CHAT_MODEL: "${CHAT_MODEL:-gemini-3.8-flash}"
      RATE_LIMIT_PER_IP: "${CHAT_RATE_LIMIT_PER_IP:-30}"
      DAILY_LIMIT: "${CHAT_DAILY_LIMIT:-1000}"

    networks:
      - deploy_default


  # ============================================================
  # OAUTH PROXY
  # ============================================================

  oauth-proxy:
    image: ${OAUTH_PROXY_IMAGE}

    container_name: termitiere-oauth-proxy

    restart: unless-stopped

    environment:
      PORT: "8080"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      OAUTH_SCOPE: "${OAUTH_SCOPE:-repo,user}"

    networks:
      - deploy_default


  # ============================================================
  # PUBLISH PROXY (offres / promotions, sans compte GitHub)
  # ============================================================

  publish-proxy:
    image: ${PUBLISH_PROXY_IMAGE}

    container_name: termitiere-publish-proxy

    restart: unless-stopped

    environment:
      PORT: "8082"
      GITHUB_TOKEN: "${PUBLISH_GITHUB_TOKEN}"
      GITHUB_REPO: "${PUBLISH_GITHUB_REPO:-martheSOK/site-vitrine-de-la-termitiere}"
      GITHUB_BRANCH: "${PUBLISH_GITHUB_BRANCH:-docker-deployment}"
      SESSION_SECRET: "${PUBLISH_SESSION_SECRET}"
      USERS_JSON: "${PUBLISH_USERS_JSON}"

    networks:
      - deploy_default


# ==============================================================
# RESEAU PARTAGE AVEC TERMITIERE-PLATFORM
# ==============================================================

networks:
  deploy_default:
    external: true
    name: deploy_default
