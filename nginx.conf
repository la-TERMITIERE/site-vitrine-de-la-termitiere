server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Espace admin et donnees publiees (offres/promotions) : jamais de cache,
    # pour que les publications/suppressions faites via /admin soient
    # visibles immediatement, sans que personne n'ait besoin de forcer
    # un rechargement.
    location /admin/ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /data/ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # JS/CSS du site change souvent (donnees des secteurs, styles) : on force
    # une revalidation a chaque chargement plutot que de laisser le
    # navigateur decider tout seul (cache heuristique) combien de temps
    # garder une ancienne version.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assistant IA (Termi) : relaye vers le conteneur termitiere-chat-proxy
    # sur le reseau Docker partage. Meme domaine que le site -> pas de
    # sous-domaine ni de CORS a configurer. Le resolveur Docker + la variable
    # evitent que nginx refuse de demarrer si l'assistant est arrete.
    location = /api/chat {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $chat_upstream http://termitiere-chat-proxy:8083;
        proxy_pass $chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
